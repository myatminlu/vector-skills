# Action majors are set to the current release by create-app.mjs and kept current by .github/dependabot.yml.
# What it proves: the code compiles, the pure logic is right, and production bundles build for both platforms.
# What it does not prove: anything a person sees — that is the device harness (QA tour, Maestro flows).
name: Quality

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Contract smoke against the mock API
        run: |
          node scripts/mock-api.mjs &
          sleep 1
          npm run api:smoke
      - name: Production bundles (both platforms)
        env:
          EXPO_PUBLIC_API_URL: https://api.example.com
        run: npx expo export --platform ios --platform android --output-dir /tmp/expo-export

  # Dependency drift is worth seeing, but a check that is always red teaches everyone to ignore checks.
  doctor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npx expo-doctor
