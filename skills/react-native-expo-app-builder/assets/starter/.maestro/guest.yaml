appId: ${APP_ID}
name: A guest browses, and account-only actions ask them to sign in
tags:
  - smoke
---
- runFlow: subflows/fresh-launch.yaml
- tapOn:
    id: continue-as-guest
# Public content from the API is visible without an account (App Store 5.1.1(v)).
- extendedWaitUntil:
    visible: "Getting started"
    timeout: 15000
- tapOn: "Getting started"
- assertVisible:
    id: item-screen
# Saving needs an account: the sign-in sheet appears, Cancel keeps the guest where they were.
- tapOn:
    id: item-save
- assertVisible:
    id: login-required-sign-in
- tapOn:
    id: login-required-cancel
- assertVisible:
    id: item-screen
# Asking needs an account too; choosing Sign in leaves guest mode and lands on the sign-in screen.
- tapOn:
    id: item-ask
- tapOn:
    id: login-required-sign-in
- extendedWaitUntil:
    visible:
      id: sign-in-screen
    timeout: 10000
