appId: ${APP_ID}
name: Sign in, save, ask (consent first, streamed answer), sign out
tags:
  - smoke
---
- runFlow: subflows/fresh-launch.yaml
- tapOn:
    id: sign-in-email
- inputText: ${QA_EMAIL}
- tapOn:
    id: sign-in-password
- inputText: ${QA_PASSWORD}
- hideKeyboard
- runFlow: subflows/dismiss-system-prompts.yaml
# On iOS, hiding the keyboard can send "Go", and the password field submits the form itself — only tap the button
# if the form is still there.
- runFlow:
    when:
      visible:
        id: sign-in-submit
    commands:
      - tapOn:
          id: sign-in-submit
- extendedWaitUntil:
    visible: "Getting started"
    timeout: 15000
- runFlow: subflows/dismiss-system-prompts.yaml
- tapOn: "Getting started"
- tapOn:
    id: item-save
- extendedWaitUntil:
    visible: "Saved"
    timeout: 10000
# Ask: the consent sheet must come before anything is sent (App Store 5.1.2(i)).
- tapOn:
    id: item-ask
- tapOn:
    id: ask-input
- inputText: "What is this?"
- hideKeyboard
- tapOn:
    id: ask-send
- assertVisible:
    id: consent-sheet
- tapOn:
    id: consent-allow
- extendedWaitUntil:
    visible: ".*mock answer.*"
    timeout: 20000
- takeScreenshot: ask-answer
# Back to the tabs and sign out.
- runFlow: subflows/back.yaml
- runFlow: subflows/back.yaml
- tapOn: "Account"
- assertVisible:
    id: account-email
- scrollUntilVisible:
    element:
      id: account-sign-out
- tapOn:
    id: account-sign-out
- extendedWaitUntil:
    visible:
      id: sign-in-screen
    timeout: 10000
